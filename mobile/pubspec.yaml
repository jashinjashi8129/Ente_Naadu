name: entenaadu
description: "Ente Naadu - Hyper-local community and marketplace app"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & State
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Maps & Location (OpenStreetMap - Free Tier)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Communication & Actions
  url_launcher: ^6.3.0

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
